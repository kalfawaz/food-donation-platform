<div class="card form-wide">
  <h1>New Donation</h1>
  <form (ngSubmit)="submit()" #f="ngForm">
    <div class="row">
      <div class="field">
        <label for="foodType">Food type *</label>
        <input id="foodType" name="foodType" [(ngModel)]="donation.foodType" required placeholder="e.g. Cooked rice" />
      </div>
      <div class="field">
        <label for="category">Category *</label>
        <select id="category" name="category" [(ngModel)]="donation.category" required>
          <option value="" disabled>Select</option>
          @for (c of categories; track c) { <option [value]="c">{{ c }}</option> }
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="quantity">Quantity (portions) *</label>
        <input id="quantity" name="quantity" type="number" min="1" [(ngModel)]="donation.quantity" required />
      </div>
      <div class="field">
        <label for="pickupLocation">Pickup location *</label>
        <input id="pickupLocation" name="pickupLocation" [(ngModel)]="donation.pickupLocation" required placeholder="Address" />
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="preparedAt">Prepared at *</label>
        <input id="preparedAt" name="preparedAt" type="datetime-local" [(ngModel)]="donation.preparedAt" required />
      </div>
      <div class="field">
        <label for="expiresAt">Expires at *</label>
        <input id="expiresAt" name="expiresAt" type="datetime-local" [(ngModel)]="donation.expiresAt" required />
      </div>
    </div>
    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="3" [(ngModel)]="donation.description"></textarea>
    </div>
    @if (error) { <p class="error">{{ error }}</p> }
    <button type="submit" [disabled]="f.invalid || loading">Publish</button>
  </form>
</div>
