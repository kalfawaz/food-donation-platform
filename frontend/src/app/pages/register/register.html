<div class="card form">
  <h1>Create an account</h1>
  <form (ngSubmit)="submit()" #f="ngForm">
    <div class="field">
      <label for="name">Full name / organization name</label>
      <input id="name" name="name" [(ngModel)]="form.name" required />
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" [(ngModel)]="form.email" required email />
    </div>
    <div class="field">
      <label for="password">Password (at least 6 characters)</label>
      <input id="password" name="password" type="password" [(ngModel)]="form.password" required minlength="6" />
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input id="phone" name="phone" [(ngModel)]="form.phone" />
    </div>
    <div class="field">
      <label for="role">I am a</label>
      <select id="role" name="role" [(ngModel)]="form.role">
        @for (r of roles; track r.value) {
          <option [value]="r.value">{{ r.label }}</option>
        }
      </select>
    </div>
    @if (error) { <p class="error">{{ error }}</p> }
    <button type="submit" [disabled]="f.invalid || loading">Register</button>
  </form>
  <p>Already have an account? <a routerLink="/login">Log in</a></p>
</div>
