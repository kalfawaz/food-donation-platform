spring.application.name=food-donation-backend
server.port=8080

# ---- MySQL connection ----
# Uses root/root by default. If your MySQL password is different, set DB_PASSWORD in IntelliJ
# (Run > Edit Configurations > Environment variables) instead of changing this file.
spring.datasource.url=jdbc:mysql://localhost:3306/food_donation?createDatabaseIfNotExist=true&serverTimezone=Asia/Riyadh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate creates and updates the tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- JWT settings ----
# Secret must be at least 32 characters
app.jwt.secret=change-this-to-a-long-random-secret-key-1234567890
# Token is valid for 24 hours
app.jwt.expiration-ms=86400000

# Angular dev server address (allowed to call this API)
app.cors.allowed-origin=http://localhost:4200
